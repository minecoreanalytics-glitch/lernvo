name: CI
on:
  push:
    branches: [main, lernvo]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lernvo, POSTGRES_PASSWORD: lernvo, POSTGRES_DB: lernvo_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lernvo" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx prisma db push --skip-generate
        env: { DATABASE_URL: postgresql://lernvo:lernvo@127.0.0.1:5432/lernvo_test }
      - run: npm test
        env: { DATABASE_URL: postgresql://lernvo:lernvo@127.0.0.1:5432/lernvo_test, JWT_SECRET: ci-secret, NODE_ENV: test }
      - name: Runtime dependencies audit (high+)
        run: npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
  tenant-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No customer-specific references in the codebase
        run: bash scripts/check-tenant-neutral.sh
      - name: Every Prisma model is tenant-scoped (or explicitly global)
        run: bash scripts/check-tenant-scope.sh
