events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 2G;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  upstream backend { server backend:4000; }
  upstream frontend { server frontend:80; }

  server {
    listen 80;
    server_name _;

    # API
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
    }

    # Uploads (media files)
    location /uploads/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Frontend (SPA)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      # Hashed build assets only: safe to cache forever
      location ~* ^/assets/.*\.(js|css|woff2|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend;
      }
      # Everything else (index.html, sw.js, manifest, icons): always revalidate,
      # otherwise browsers/PWA keep serving stale bundles after a deploy
      location ~* ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        proxy_pass http://frontend;
      }
    }
  }
}
