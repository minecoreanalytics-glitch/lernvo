worker_processes auto;

# Chaque client proxifié consomme DEUX connexions (navigateur + amont) : à 1024, un seul bureau
# de 500 personnes qui charge son tableau de bord saturait le worker et recevait des 502.
events { worker_connections 8192; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 2G;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting
  # Garde-fou anti-DDoS uniquement : une entreprise entière partage une seule IP publique.
  # Les limites utiles (par utilisateur) sont appliquées par l'API — backend/src/middleware/limits.ts
  limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
  limit_conn_zone $binary_remote_addr zone=apiconn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Pool de connexions persistantes vers Node : sans lui, nginx ouvre un socket par requête et
  # une rafale de plusieurs centaines de requêtes épuise les ports éphémères.
  upstream backend {
    server backend:4000;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
  }
  upstream frontend {
    server frontend:80;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # API
    location /api/ {
      # Un bureau de plusieurs centaines d'employés partage une seule IP publique : ce plancher
      # ne doit attraper qu'une attaque, pas une prise de service. L'équité par utilisateur est
      # assurée par l'API (backend/src/middleware/limits.ts).
      limit_req zone=api burst=2000 nodelay;
      limit_conn apiconn 500;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
    }

    # Uploads (media files)
    location /uploads/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Frontend (SPA)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      # Hashed build assets only: safe to cache forever
      location ~* ^/assets/.*\.(js|css|woff2|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend;
      }
      # Everything else (index.html, sw.js, manifest, icons): always revalidate,
      # otherwise browsers/PWA keep serving stale bundles after a deploy
      location ~* ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js|favicon\.svg|apple-touch-icon\.png|og-image\.png)$ {
        add_header Cache-Control "no-cache";
        proxy_pass http://frontend;
      }
    }
  }
}
