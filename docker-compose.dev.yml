# Local development stack — Postgres + Redis only.
# Backend/frontend run on the host with hot reload (npm run dev).
#   docker compose -f docker-compose.dev.yml up -d
name: lernvo-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: lernvo-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lernvo
      POSTGRES_USER: lernvo
      POSTGRES_PASSWORD: lernvo
    ports:
      - "5432:5432"
    volumes:
      - lernvo_dev_pg:/var/lib/postgresql/data
      - ./docker/dev-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lernvo"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: lernvo-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  lernvo_dev_pg:
