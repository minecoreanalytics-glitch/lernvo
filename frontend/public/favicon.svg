<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163A6B"/>
      <stop offset="100%" stop-color="#1E4F8C"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5A0"/>
      <stop offset="55%" stop-color="#4A8DC8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Ascending growth chevrons: knowledge compounding upward -->
  <g fill="none" stroke="url(#spark)" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="150,330 230,250 296,316 392,196" stroke-width="34"/>
  </g>
  <!-- Apex spark: the goal / mastery reached -->
  <circle cx="392" cy="196" r="30" fill="#7DD3FC"/>
  <circle cx="392" cy="196" r="14" fill="#ffffff"/>
  <!-- Foundation baseline: the platform / steady base -->
  <rect x="150" y="372" width="212" height="16" rx="8" fill="#4A8DC8" opacity="0.55"/>
</svg>
