# Explicit project name — never let this stack share a Compose project with
# another stack living in a folder named "docker" (the directory-derived project
# name would collide and `up`/`down` would reconcile the other stack's containers
# out). Always also pass `-p lernvo`.
name: lernvo

services:
  postgres:
    image: postgres:16-alpine
    container_name: lernvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lernvo}
      POSTGRES_USER: ${POSTGRES_USER:-lernvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - lernvo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lernvo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lernvo]

  redis:
    image: redis:7-alpine
    container_name: lernvo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - lernvo_redis:/data
    networks: [lernvo]

  backend:
    build: { context: ../backend, dockerfile: Dockerfile }
    container_name: lernvo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # bcrypt s'exécute sur le pool de threads libuv (4 par défaut) : c'est lui qui plafonne les
      # connexions simultanées, pas la base de données. La machine a 8 cœurs.
      UV_THREADPOOL_SIZE: "8"

      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lernvo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lernvo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://${DOMAIN:-lernvo.com}
      PLATFORM_NAME: Lernvo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MORPHEUS_CORE_URL: ${MORPHEUS_CORE_URL:-}
      MORPHEUS_API_KEY: ${MORPHEUS_API_KEY:-}
      LEADS_WEBHOOK_URL: ${LEADS_WEBHOOK_URL:-}
    volumes:
      - lernvo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [lernvo]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args: { VITE_API_URL: "https://${DOMAIN:-lernvo.com}/api" }
    container_name: lernvo-frontend
    restart: unless-stopped
    networks: [lernvo]

  nginx:
    image: nginx:alpine
    container_name: lernvo-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, frontend]
    networks: [lernvo]

volumes:
  lernvo_pg:
  lernvo_redis:
  lernvo_uploads:

networks:
  lernvo: { driver: bridge }
